[project]
name = "local-document-intelligence"
version = "0.1.0"
description = "Local-first document intelligence pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13.3",
    "celery>=5.4.0",
    "docling>=2.97.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "neo4j>=5.25,<6",
    "psycopg[binary]>=3.2.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "redis>=5.1.1",
    "sqlalchemy>=2.0.35",
    "structlog>=24.4.0",
    "typer>=0.12.5",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.5",
    "ruff>=0.6.9",
]

[project.scripts]
docintel = "docintel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_sample_documents.py" = ["E501"]
"scripts/generate_rich_sample_documents.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["docintel"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require local Docker services",
    "live_model: tests that require live local model services",
]
